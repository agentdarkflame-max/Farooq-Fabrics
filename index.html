<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store</title>
<style>
:root{--m:#111;--a:#d4a017;--s:#f4f4f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;color:#111;line-height:1.4}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:var(--s)}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:4px 0 10px}
.p{background:var(--a);font-weight:700}
header{position:sticky;top:0;z-index:9;background:var(--m);color:#fff;padding:10px 12px}
header button{background:#2a2a2a;color:#fff;padding:8px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:1px}
.hero{background:linear-gradient(135deg,var(--m),#333);color:#fff;text-align:center;padding:50px 16px}
.hero h1{font-size:28px}
main{padding:16px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--s);border-radius:10px;overflow:hidden}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:#e5e5e5;display:flex;align-items:center;justify-content:center;font-size:50px}
.i{padding:10px}
.box{background:var(--s);border-radius:10px;padding:14px;margin-bottom:12px}
.chip.on{background:var(--m);color:#fff}
.stat{flex:1;min-width:140px;background:var(--s);border-radius:10px;padding:12px}
.stat b{display:block;font-size:18px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#ddd}
.note{background:#fff3cd;padding:10px;border-radius:8px;margin-bottom:10px}
</style></head><body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,getDocs,updateDoc,deleteDoc,query,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// config: brand stuff and firebase keys live here
const CONFIG={
  brand:"FAROOQ FABRICS",
  tagline:"Style that fits you",
  main:"#111111",
  accent:"#d4a017",
  currency:"Rs ",
  firebase:{apiKey:"AIzaSyCsO78t-MlGlgk_z4J3A_ujQyxNXK94y4A",authDomain:"farooq-fabrics.firebaseapp.com",projectId:"farooq-fabrics",appId:"1:1021735432205:web:4d78324bde833dc232a544"}
};

const $=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u||"")?E(u):"#";
const M=n=>CONFIG.currency+Math.round(n).toLocaleString();
let user=null,role="customer",products=[],orders=[],team=[],settings={},cat="All",q="",view="shop",tab="stats";
let cart=[];try{cart=JSON.parse(localStorage.getItem("cart"))||[]}catch(e){}
const saveCart=()=>{try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){}};
const isStaff=()=>role=="owner"||role=="admin";
document.documentElement.style.setProperty("--m",CONFIG.main);
document.documentElement.style.setProperty("--a",CONFIG.accent);
document.title=CONFIG.brand;

let auth,db;
if(CONFIG.firebase.apiKey){const app=initializeApp(CONFIG.firebase);auth=getAuth(app);db=getFirestore(app)}

async function loadShop(){
  products=(await getDocs(collection(db,"products"))).docs.map(d=>({id:d.id,...d.data()}));
  const s=await getDoc(doc(db,"settings","main"));settings=s.exists()?s.data():{};
}
async function loadOrders(){
  orders=[];if(!user)return;
  const ref=isStaff()?collection(db,"orders"):query(collection(db,"orders"),where("uid","==",user.uid));
  orders=(await getDocs(ref)).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created);
}
async function loadTeam(){
  team=[];if(role!="owner")return;
  team=(await getDocs(collection(db,"users"))).docs.map(d=>({id:d.id,...d.data()}));
}

if(db)onAuthStateChanged(auth,async u=>{
  user=u;role="customer";
  if(u){
    const r=doc(db,"users",u.uid),s=await getDoc(r);
    if(s.exists())role=s.data().role||"customer";
    else await setDoc(r,{email:u.email,role:"customer"});
  }
  await loadShop();await loadOrders();await loadTeam();render();
});

function head(){
  const n=cart.reduce((a,c)=>a+c.qty,0);
  return `<header><div class="row sp"><span class="logo">${E(CONFIG.brand)}</span><div class="row">
  <button data-a="go" data-v="shop">Shop</button>
  <button data-a="go" data-v="cart">Cart (${n})</button>
  <button data-a="go" data-v="${user?"orders":"login"}">${user?"My orders":"Login"}</button>
  ${isStaff()?`<button data-a="go" data-v="admin">Dashboard</button>`:""}
  ${user?`<button data-a="out">Logout</button>`:""}</div></div></header>`;
}

function gridHTML(){
  const list=products.filter(p=>(cat=="All"||p.cat==cat)&&(p.name||"").toLowerCase().includes(q));
  if(!list.length)return "<p>No products yet.</p>";
  return list.map(p=>`<div class="card">${p.image?`<img src="${safe(p.image)}" loading="lazy" alt="">`:`<div class="ph">👕</div>`}
  <div class="i"><b>${E(p.name)}</b><br>${M(p.price)}
  <select id="s${p.id}">${(p.sizes||"One size").split(",").map(s=>`<option>${E(s.trim())}</option>`).join("")}</select>
  <button class="p" style="width:100%" data-a="add" data-id="${p.id}">Add to cart</button></div></div>`).join("");
}
function shop(){
  const cats=["All",...new Set(products.map(p=>p.cat).filter(Boolean))];
  return `<div class="hero"><h1>${E(CONFIG.tagline)}</h1></div><main>
  <input id="q" placeholder="Search clothes..." value="${E(q)}">
  <div class="row" style="margin-bottom:12px">${cats.map(c=>`<button class="chip ${c==cat?"on":""}" data-a="cat" data-c="${E(c)}">${E(c)}</button>`).join("")}</div>
  <div class="grid" id="grid">${gridHTML()}</div></main>`;
}

function payInfo(m){
  const s=settings;
  if(m=="card")return `Pay by card here: <a href="${safe(s.cardLink)}" target="_blank">secure card payment</a>, then paste the receipt ID below.`;
  if(m=="paypal")return `Pay with <a href="${safe(s.paypalLink)}" target="_blank">PayPal</a>, then paste the transaction ID below.`;
  if(m=="easypaisa")return `Send the total to EasyPaisa: <b>${E(s.easypaisa||"not set yet")}</b>, then paste the transaction ID below.`;
  if(m=="bank")return `Transfer to: <b>${E(s.bank||"not set yet")}</b>, then paste the reference below.`;
  return "Pay the courier when your order arrives.";
}
function checkout(){
  return `<div class="box"><h3>Delivery</h3><input id="cn" placeholder="Full name"><input id="cp" placeholder="Phone"><textarea id="ca" placeholder="Address"></textarea>
  <h3>Payment</h3><select id="pm"><option value="card">Debit / credit card</option><option value="paypal">PayPal</option><option value="easypaisa">EasyPaisa</option><option value="bank">Bank transfer</option><option value="cod">Cash on delivery</option></select>
  <p id="pi" style="margin-bottom:8px"></p><input id="cr" placeholder="Payment reference / transaction ID">
  <button class="p" style="width:100%" data-a="order">Place order</button></div>`;
}
function cartView(){
  if(!cart.length)return `<main><p>Your cart is empty.</p></main>`;
  const t=cart.reduce((a,c)=>a+c.price*c.qty,0);
  return `<main><h2>Cart</h2>${cart.map((c,i)=>`<div class="box row sp"><span>${E(c.name)} (${E(c.size)}) x${c.qty}<br>${M(c.price*c.qty)}</span>
  <span><button data-a="qm" data-i="${i}">-</button> <button data-a="qp" data-i="${i}">+</button> <button data-a="rm" data-i="${i}">✕</button></span></div>`).join("")}
  <h3 style="margin:10px 0">Total: ${M(t)}</h3>
  ${user?checkout():`<p class="note">Login first to place your order.</p><button class="p" data-a="go" data-v="login">Login or sign up</button>`}</main>`;
}
function login(){
  return `<main style="max-width:400px"><h2>Login or sign up</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)">
  <button class="p" style="width:100%" data-a="in">Login</button><br><br><button style="width:100%" data-a="up">Create account</button></main>`;
}
function orderBox(o,admin){
  return `<div class="box"><div class="row sp"><b>${M(o.total)}</b><span class="tag">${E(o.status)}</span></div>
  ${o.items.map(i=>`${E(i.name)} (${E(i.size)}) x${i.qty}`).join("<br>")}<br>
  <small>${new Date(o.created).toLocaleString()} | ${E(o.method)} | ref: ${E(o.ref||"-")}</small>
  ${admin?`<br><small>${E(o.name)} | ${E(o.phone)} | ${E(o.address)} | ${E(o.email)}</small><div class="row" style="margin-top:8px">
  <button data-a="st" data-id="${o.id}" data-s="paid">Paid</button><button data-a="st" data-id="${o.id}" data-s="shipped">Shipped</button><button data-a="st" data-id="${o.id}" data-s="cancelled">Cancel</button></div>`:""}</div>`;
}
function ordersView(){return `<main><h2>My orders</h2>${orders.map(o=>orderBox(o,false)).join("")||"<p>No orders yet.</p>"}</main>`}

function stats(){
  const n=new Date(),day=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  const ranges={"Today":day,"Last 7 days":day-6*864e5,"This month":new Date(n.getFullYear(),n.getMonth(),1).getTime(),"This year":new Date(n.getFullYear(),0,1).getTime()};
  const ok=orders.filter(o=>o.status=="paid"||o.status=="shipped");
  return Object.entries(ranges).map(([k,t])=>{
    const l=ok.filter(o=>o.created>=t),rev=l.reduce((a,o)=>a+o.total,0);
    const cost=l.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.cost*i.qty,0),0);
    return `<div class="box"><b>${k}</b><div class="row" style="margin-top:8px"><div class="stat">Earned<b>${M(rev)}</b></div><div class="stat">Profit<b>${M(rev-cost)}</b></div><div class="stat">Sales<b>${l.length}</b></div></div></div>`;
  }).join("")+`<p>Waiting for payment check: ${orders.filter(o=>o.status=="pending").length}</p>`;
}
function admin(){
  const tabs=["stats","products","orders"].concat(role=="owner"?["settings","team"]:[]);
  let body="";
  if(tab=="stats")body=stats();
  if(tab=="products")body=`<div class="box"><h3>Add clothing</h3><input id="pn" placeholder="Name"><input id="pr" type="number" placeholder="Selling price"><input id="pc" type="number" placeholder="Your cost (for profit)"><input id="pt" placeholder="Category, e.g. Men"><input id="pg" placeholder="Image link (https://...)"><input id="ps" placeholder="Sizes, e.g. S,M,L,XL"><button class="p" data-a="addp">Add product</button></div>`
    +products.map(p=>`<div class="box row sp"><span>${E(p.name)} - ${M(p.price)}</span><button data-a="delp" data-id="${p.id}">Delete</button></div>`).join("");
  if(tab=="orders")body=orders.map(o=>orderBox(o,true)).join("")||"<p>No orders yet.</p>";
  if(tab=="settings")body=`<div class="box"><h3>Payment details</h3><input id="s1" placeholder="Card payment link" value="${E(settings.cardLink)}"><input id="s2" placeholder="PayPal link" value="${E(settings.paypalLink)}"><input id="s3" placeholder="EasyPaisa number and name" value="${E(settings.easypaisa)}"><input id="s4" placeholder="Bank name, account number, title" value="${E(settings.bank)}"><button class="p" data-a="save">Save</button></div>`;
  if(tab=="team")body=`<div class="box"><h3>Give or remove a role</h3><input id="te" type="email" placeholder="Their account email"><select id="tr"><option value="admin">Admin (manage products and orders)</option><option value="customer">Normal shopper</option></select><button class="p" data-a="role">Save role</button></div>`
    +team.map(u=>`<div class="box">${E(u.email)} <span class="tag">${E(u.role)}</span></div>`).join("");
  return `<main><div class="row" style="margin-bottom:12px">${tabs.map(t=>`<button class="chip ${t==tab?"on":""}" data-a="tab" data-t="${t}">${t}</button>`).join("")}</div>${body}</main>`;
}

function render(){
  let body;
  if(!db)body=`<main><p class="note">Paste your Firebase keys into CONFIG at the top first.</p></main>`;
  else if(view=="cart")body=cartView();
  else if(view=="login")body=login();
  else if(view=="orders"&&user)body=ordersView();
  else if(view=="admin"&&isStaff())body=admin();
  else body=shop();
  $("#app").innerHTML=head()+body;
  const pm=$("#pm");if(pm)$("#pi").innerHTML=payInfo(pm.value);
}

async function placeOrder(){
  const f=id=>$("#"+id).value.trim(),m=f("pm");
  if(!f("cn")||!f("cp")||!f("ca"))return alert("Fill in your name, phone and address");
  if(m!="cod"&&!f("cr"))return alert("Add your payment reference");
  await addDoc(collection(db,"orders"),{uid:user.uid,email:user.email,name:f("cn"),phone:f("cp"),address:f("ca"),method:m,ref:f("cr"),
    items:cart.map(c=>({id:c.id,name:c.name,size:c.size,price:c.price,cost:c.cost||0,qty:c.qty})),
    total:cart.reduce((a,c)=>a+c.price*c.qty,0),status:"pending",created:Date.now()});
  cart=[];saveCart();await loadOrders();view="orders";render();
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  try{
    if(a=="go"){view=d.v;if(view=="admin"){await loadOrders();await loadTeam()}render()}
    else if(a=="cat"){cat=d.c;render()}
    else if(a=="add"){
      const p=products.find(x=>x.id==d.id),size=$("#s"+d.id).value;
      const ex=cart.find(c=>c.id==p.id&&c.size==size);
      if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost||0,size,qty:1});
      saveCart();render();
    }
    else if(a=="qm"){if(cart[d.i].qty>1)cart[d.i].qty--;saveCart();render()}
    else if(a=="qp"){cart[d.i].qty++;saveCart();render()}
    else if(a=="rm"){cart.splice(d.i,1);saveCart();render()}
    else if(a=="in"){view="shop";await signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}
    else if(a=="up"){view="shop";await createUserWithEmailAndPassword(auth,$("#em").value,$("#pw").value)}
    else if(a=="out"){view="shop";await signOut(auth)}
    else if(a=="order")await placeOrder();
    else if(a=="tab"){tab=d.t;render()}
    else if(a=="addp"){
      await addDoc(collection(db,"products"),{name:$("#pn").value.trim(),price:+$("#pr").value,cost:+$("#pc").value||0,cat:$("#pt").value.trim(),image:$("#pg").value.trim(),sizes:$("#ps").value.trim()||"One size"});
      await loadShop();render();
    }
    else if(a=="delp"){if(confirm("Delete this product?")){await deleteDoc(doc(db,"products",d.id));await loadShop();render()}}
    else if(a=="st"){await updateDoc(doc(db,"orders",d.id),{status:d.s});await loadOrders();render()}
    else if(a=="save"){
      await setDoc(doc(db,"settings","main"),{cardLink:$("#s1").value.trim(),paypalLink:$("#s2").value.trim(),easypaisa:$("#s3").value.trim(),bank:$("#s4").value.trim()});
      await loadShop();alert("Saved");
    }
    else if(a=="role"){
      const u=team.find(x=>x.email==$("#te").value.trim());
      if(!u)return alert("No account with that email. They need to sign up first.");
      if(u.id==user.uid)return alert("You can't change your own role here.");
      await updateDoc(doc(db,"users",u.id),{role:$("#tr").value});
      await loadTeam();render();
    }
  }catch(err){alert(err.message)}
});
document.addEventListener("change",e=>{if(e.target.id=="pm")$("#pi").innerHTML=payInfo(e.target.value)});
document.addEventListener("input",e=>{if(e.target.id=="q"){q=e.target.value.toLowerCase();$("#grid").innerHTML=gridHTML()}});
render();
</script>
</body></html>
